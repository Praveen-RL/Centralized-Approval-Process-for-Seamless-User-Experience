{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h2 class="mb-0">Server Error (500)</h2>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-exclamation-circle fa-5x text-danger mb-4"></i>
                    <h3>Oops! Something went wrong on our end.</h3>
                    <p class="lead">The server encountered an internal error and was unable to complete your request.</p>
                    <p>Please try again later or contact support if the problem persists.</p>
                    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">
                        <i class="fas fa-home"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
