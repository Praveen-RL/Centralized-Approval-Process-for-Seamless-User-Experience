{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h2 class="mb-0">Page Not Found (404)</h2>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-exclamation-triangle fa-5x text-danger mb-4"></i>
                    <h3>Oops! The page you are looking for does not exist.</h3>
                    <p class="lead">The requested page could not be found on the server.</p>
                    <p>Please check the URL or return to the home page.</p>
                    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">
                        <i class="fas fa-home"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
